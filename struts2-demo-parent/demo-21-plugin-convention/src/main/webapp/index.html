<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Demo 21: Convention Plugin</title>
</head>
<body>
    <h1>Demo 21: Convention Plugin（Struts 2 约定插件）</h1>
    <p>本 demo 完全无 <code>struts.xml</code>，仅靠 <code>@Action</code> / <code>@Namespace</code> / <code>@Result</code> 注解驱动。</p>
    <ul>
        <li><a href="convention/hello.action">/convention/hello.action</a> - 进入 ConventionAction</li>
    </ul>
    <p>配置关键点：<code>struts.properties</code> 中声明 <code>struts.convention.action.packages</code> 扫描本 demo 的包路径。</p>
</body>
</html>
