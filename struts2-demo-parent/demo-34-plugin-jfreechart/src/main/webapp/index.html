<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Demo 34 - JFreeChart</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 2em auto; }
        figure { margin: 1.5em 0; }
        figcaption { color: #666; margin-bottom: 0.5em; }
        img { max-width: 100%; border: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>Demo 34: JFreeChart（服务端图表）</h1>
    <p>chart result 把 <code>JFreeChart</code> 直接渲染为 PNG，<code>&lt;img&gt;</code> 标签即可引用。</p>

    <figure>
        <figcaption>水果销量饼图</figcaption>
        <img src="chart/pie.action" alt="销量饼图"/>
    </figure>

    <figure>
        <figcaption>月度销量柱状图</figcaption>
        <img src="chart/bar.action" alt="销量柱状图"/>
    </figure>

    <figure>
        <figcaption>周访问量折线图</figcaption>
        <img src="chart/line.action" alt="PV 折线图"/>
    </figure>
</body>
</html>
